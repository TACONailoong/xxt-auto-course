<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学习通助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <img class="brand-mark" src="icons/icon48.png" alt="" width="36" height="36">
        <div class="brand-text">
          <h1>学习通助手</h1>
          <p>自动播放 · 倍速 · 切章</p>
        </div>
      </div>
      <div class="run-row">
        <div class="run-copy">
          <span class="run-label" id="statusText">已停止</span>
          <span class="run-hint">总开关</span>
        </div>
        <div
          class="toggle-switch toggle-lg"
          id="toggleAuto"
          role="switch"
          tabindex="0"
          aria-checked="false"
          aria-label="开启自动刷课"
        ></div>
      </div>
    </header>

    <section class="now" aria-label="当前状态">
      <div class="now-top">
        <span class="now-kicker">正在学习</span>
        <span class="now-meta" id="speedValue">1.5x</span>
      </div>
      <h2 class="now-chapter" id="liveChapter">尚未连接课程页</h2>
      <p class="now-detail" id="liveDetail">打开学习通播放页后，这里会显示实时进度</p>
      <div class="progress" aria-hidden="true">
        <span id="liveProgress"></span>
      </div>
    </section>

    <section class="speed" aria-label="播放倍速">
      <div class="section-head">
        <h3>播放倍速</h3>
        <span class="section-note">建议 1.5x – 2x</span>
      </div>
      <input
        type="range"
        class="speed-slider"
        id="speedSlider"
        min="0.5"
        max="4"
        step="0.25"
        value="1.5"
        aria-label="播放倍速"
      >
      <div class="speed-presets">
        <button class="preset-btn" type="button" data-speed="1">1x</button>
        <button class="preset-btn" type="button" data-speed="1.5">1.5x</button>
        <button class="preset-btn" type="button" data-speed="2">2x</button>
        <button class="preset-btn" type="button" data-speed="3">3x</button>
      </div>
    </section>

    <details class="more" id="moreSettings">
      <summary>
        <span>更多选项</span>
        <span class="chevron" aria-hidden="true"></span>
      </summary>
      <div class="more-body">
        <div class="control-row">
          <div class="text">
            <span class="title">自动答题</span>
            <span class="desc">视频弹窗题随机作答</span>
          </div>
          <div class="toggle-switch" id="toggleAnswer" role="switch" tabindex="0" aria-checked="false" aria-label="自动答题"></div>
        </div>
        <div class="control-row">
          <div class="text">
            <span class="title">静音播放</span>
            <span class="desc">提高自动播放成功率</span>
          </div>
          <div class="toggle-switch" id="toggleMute" role="switch" tabindex="0" aria-checked="false" aria-label="静音播放"></div>
        </div>
        <div class="control-row">
          <div class="text">
            <span class="title">跳过章节测验</span>
            <span class="desc">测验页自动进入下一节</span>
          </div>
          <div class="toggle-switch" id="toggleSkipQuiz" role="switch" tabindex="0" aria-checked="false" aria-label="跳过章节测验"></div>
        </div>
        <div class="control-row">
          <div class="text">
            <span class="title">自动下一节</span>
            <span class="desc">视频或任务完成后继续</span>
          </div>
          <div class="toggle-switch" id="toggleAutoNext" role="switch" tabindex="0" aria-checked="false" aria-label="自动下一节"></div>
        </div>
        <div class="control-row">
          <div class="text">
            <span class="title">关闭防挂机提示</span>
            <span class="desc">自动点“继续学习”</span>
          </div>
          <div class="toggle-switch" id="toggleDismissIdle" role="switch" tabindex="0" aria-checked="false" aria-label="关闭防挂机提示"></div>
        </div>
        <div class="control-row">
          <div class="text">
            <span class="title">显示页面浮层</span>
            <span class="desc">课程页右下角状态面板</span>
          </div>
          <div class="toggle-switch" id="toggleShowHud" role="switch" tabindex="0" aria-checked="false" aria-label="显示页面浮层"></div>
        </div>
      </div>
    </details>

    <section class="activity" aria-label="最近活动">
      <div class="section-head">
        <h3>最近活动</h3>
        <button class="ghost-btn" id="clearLogBtn" type="button">清空</button>
      </div>
      <ul class="log-list" id="logList">
        <li class="empty">暂无活动记录</li>
      </ul>
    </section>

    <p class="save-hint" id="saveHint" role="status">已自动保存</p>
    <footer class="footer">v1.5.0 · 仅供学习交流</footer>
  </main>

  <!-- 兼容旧测试选择器 -->
  <div id="statusDot" class="sr-only" aria-hidden="true"></div>

  <script src="shared/defaults.js"></script>
  <script src="shared/dom.js"></script>
  <script src="popup.js"></script>
</body>
</html>
